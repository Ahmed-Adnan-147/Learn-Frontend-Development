<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT Preview Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="nft-card">
    <img src="nft-preview-card-component-main/images/image-equilibrium.jpg" alt="">

    <h2>Equilibrium #3429</h2>
    <p class="description">Our Equilibrium collection promotes balance and calm.</p>

    <div class="units">
      <div class="left-sec">
        <img src="nft-preview-card-component-main/images/icon-ethereum.svg">
        <p>0.041ETH</p>
      </div>
      <div class="right-sec">
        <img src="nft-preview-card-component-main/images/icon-clock.svg">
        <p>3 days left</p>
      </div>
    </div>
    <!-- <hr> -->
    <div class="divider"></div>

    <div class="footer-info">
      <img src="nft-preview-card-component-main/images/image-avatar.png">
      <p>Creation of <span>Jules Wyvern</span></p>
    </div>
  </div>
</body>
</html>
